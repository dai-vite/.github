name: Bug
description: Qualcosa non funziona come dovrebbe
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Grazie della segnalazione. Per una vulnerabilità NON usare questo modulo: segui SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: Cosa succede
      description: Il comportamento osservato, con eventuali messaggi di errore.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Cosa ti aspettavi
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Come riprodurlo
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versione o commit
  - type: dropdown
    id: priority
    attributes:
      label: Urgenza percepita
      options:
        - bassa
        - media
        - alta
